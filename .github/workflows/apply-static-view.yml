name: Apply static view extraction

on:
  push:
    branches:
      - agent/ai-features-chunk
    paths:
      - scripts/view-shell-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-static-view-extraction.mjs
      - run: npm run test:ui
      - run: node scripts/test-chat-view-boundary.mjs
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire extracted view component"
          git push origin HEAD:${GITHUB_REF_NAME}
