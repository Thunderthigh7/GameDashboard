name: Install Automations tab

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-automations-tab.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Automations script to dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("public/index.html")
          html = path.read_text(encoding="utf-8")
          needle = '    <script defer src="/assets/20260812-2/app.js"></script>'
          addition = '    <script defer src="/automations.js?v=20260813-1"></script>'
          if addition not in html:
              if needle not in html:
                  raise SystemExit("Could not find app.js script anchor")
              html = html.replace(needle, needle + "\n" + addition, 1)
              path.write_text(html, encoding="utf-8")
          PY
      - name: Commit install
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Load Automations showcase tab"
          git push
