name: UI checks

on:
  pull_request:
    paths:
      - "public/**"
      - "scripts/test-ui-component-boundaries.mjs"
      - "package.json"

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:ui
