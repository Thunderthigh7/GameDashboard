name: Apply Assets extraction

on:
  push:
    branches:
      - agent/assets-chunk
    paths:
      - scripts/apply-assets-extraction.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch dashboard shell
        run: node scripts/apply-assets-extraction.mjs
      - name: Check UI boundaries
        run: npm run test:ui
      - name: Check whitespace
        run: git diff --check
      - name: Commit generated shell change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "No shell change needed"
            exit 0
          fi
          git commit -m "Wire Assets view component"
          git push origin HEAD:${GITHUB_REF_NAME}
